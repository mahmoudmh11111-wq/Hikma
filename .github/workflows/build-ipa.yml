name: Build Hikma IPA

# Builds an UNSIGNED .ipa on a free GitHub macOS machine.
# Sideloadly signs it with your Apple ID when you install it.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Same build setup as Noter.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project Hikma.xcodeproj -scheme Hikma -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Hikma.xcodeproj -scheme Hikma -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hikma.app Payload/
          zip -qry Hikma.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hikma-ipa
          path: Hikma.ipa
